name: bootstrap
on: 
  workflow_dispatch:
  schedule:
    - cron:  '0 1-23/2 * * *'

jobs:
  bootstrap_actions:
    runs-on: ubuntu-latest
    permissions: write-all
    steps:
      - name: checkout
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # main
        with:
          token: ${{ secrets.BOOTSTRAP_WORKFLOWS || github.token }}
      - id: bootstrap
        uses: manjaro-contrib/action-bootstrap-actions@main
        with:
          upstream: https://aur.archlinux.org/sway-services-git.git
